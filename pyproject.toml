[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "efficientlm"
version = "0.1.0"
description = "Parameter-efficient fine-tuning, distillation and tool-calling agent: a B.Tech mini-project"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
